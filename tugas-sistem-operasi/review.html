<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komentar Dosen</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../Asset/ft.png">
  <link rel="shortcut icon" href="../Asset/ft.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/swiss.css">

  <!-- Immediate Theme Initializer & Route Guard -->
  <script src="js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.ArchiveAuth.requireAuth();
  </script>
</head>

<body>

  <!-- TOPBAR NAVIGATION -->
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-brand">
        <a href="admin.html" style="display: flex; align-items: center; gap: 8px;">
          <span style="display: inline-block; width: 10px; height: 10px; background: var(--accent);"></span>
          <span style="font-size: 1.05rem; letter-spacing: -0.02em;">PORTAL MAHASISWA</span>
        </a>
        <span class="topbar-badge">KOMENTAR DOSEN</span>
      </div>

      <nav class="topbar-nav">
        <a href="admin.html" class="nav-link">&larr; Kembali ke Dashboard</a>
        <a href="index.html" class="nav-link">Lihat Arsip Publik</a>
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Ganti Mode Tampilan">
          <!-- Icon injected by theme.js -->
        </button>
      </nav>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="container-narrow" style="padding-top: var(--space-8); padding-bottom: var(--space-16);">

    <!-- BREADCRUMB -->
    <nav class="breadcrumb">
      <a href="admin.html">Dashboard</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-current">Komentar Dosen</span>
    </nav>

    <!-- HEADER TITLE & METRICS -->
    <header style="margin-bottom: var(--space-8);">
      <div style="border-bottom: var(--hairline-strong); padding-bottom: var(--space-4); margin-bottom: var(--space-6);">
        <span class="type-micro" style="color: var(--accent); display: block; margin-bottom: 4px;">KOMENTAR MASUK</span>
        <h1 class="type-h1">Daftar Komentar Dosen</h1>
      </div>

      <!-- 3 Metrics Block (Swiss Style) -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: var(--hairline);">
        <div style="background: var(--surface); padding: var(--space-3) var(--space-4);">
          <span class="type-micro" style="color: var(--text-muted); display: block;">TOTAL KOMENTAR</span>
          <span class="type-display" style="font-size: 1.75rem;" id="review-stat-total">0</span>
        </div>
        <div style="background: var(--surface); padding: var(--space-3) var(--space-4);">
          <span class="type-micro" style="color: var(--text-muted); display: block;">TUGAS TERULAS</span>
          <span class="type-display" style="font-size: 1.75rem; color: var(--text-primary);" id="review-stat-tasks">0</span>
        </div>
        <div style="background: var(--surface); padding: var(--space-3) var(--space-4);">
          <span class="type-micro" style="color: var(--text-muted); display: block;">TANGGAL TERAKHIR</span>
          <span class="font-heading" style="font-size: 1.1rem; display: block; margin-top: 6px;" id="review-stat-latest">-</span>
        </div>
      </div>
    </header>

    <!-- FILTER TOOLBAR -->
    <section style="margin-bottom: var(--space-6);">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); background: var(--surface); padding: var(--space-3) var(--space-4); border: var(--hairline); border-radius: var(--radius-sm);">
        <label for="review-filter-assignment" class="type-micro" style="color: var(--text-secondary); white-space: nowrap;">FILTER TUGAS:</label>
        <select id="review-filter-assignment" class="form-control" style="width: 100%; max-width: 420px; padding: 6px 12px; font-family: var(--font-mono); font-size: var(--text-small);">
          <!-- Options injected by review.js -->
        </select>
      </div>
    </section>

    <!-- REVIEWS FEED -->
    <section>
      <div id="review-feed-container">
        <!-- Injected dynamically by review.js -->
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="archive-footer">
    <div class="container footer-inner">
      <div>
        &copy; 2026 Academic Archive Portal. Mahasiswa: Endru Aidil Fitriansyah (NIM 2503010054).
      </div>
      <div>
        <a href="admin.html">Dashboard Mahasiswa</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
